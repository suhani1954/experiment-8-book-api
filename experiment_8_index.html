<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Collection Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Book Collection Manager</h1>
    <form id="bookForm">
      <input id="title" placeholder="Book title" required>
      <input id="author" placeholder="Author name" required>
      <input id="year" type="number" placeholder="Publication year" required>
      <button id="submitBtn" type="submit">Add Book</button>
    </form>
    <p id="message" role="status"></p>
    <h2>My Books</h2>
    <section id="bookList"></section>
  </main>
</body>
</html>
